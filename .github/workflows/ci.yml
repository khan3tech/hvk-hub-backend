name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (001 auth quickstart)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: teamloom
          POSTGRES_PASSWORD: teamloom
          POSTGRES_DB: teamloom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teamloom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # .env.example already points at localhost:5432 with the teamloom credentials above.
      - run: cp .env.example .env
      - run: npx prisma migrate deploy
      - run: npm run seed
      - name: Start API
        run: |
          npx tsx --env-file=.env src/server.ts > api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/health && exit 0
            sleep 1
          done
          echo "API did not become healthy"; cat api.log; exit 1
      - run: node scripts/e2e-001-auth.mjs
      - run: node scripts/e2e/run-all.mjs
        env:
          DATABASE_URL: postgresql://teamloom:teamloom@localhost:5432/teamloom
      - name: API log on failure
        if: failure()
        run: tail -n 200 api.log || true
